name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.*', testbench: '10.*', filament: '4.*', pest: '3.*' }
          - { php: '8.2', laravel: '12.*', testbench: '10.*', filament: '4.*', pest: '3.*', lowest: true }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', filament: '5.*', pest: '4.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', filament: '4.*', pest: '4.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', filament: '5.*', pest: '4.*' }
          - { php: '8.5', laravel: '13.*', testbench: '11.*', filament: '5.*', pest: '4.*' }

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Filament ${{ matrix.filament }}${{ matrix.lowest && ' · lowest' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl, fileinfo
          coverage: none

      - name: Drop the browser plugin and Larastan on Pest 3
        if: matrix.pest == '3.*'
        run: composer remove --dev pestphp/pest-plugin-browser larastan/larastan --no-update --no-interaction

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer require --dev "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest }}" "pestphp/pest-plugin-livewire:${{ matrix.pest }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --with-all-dependencies ${{ matrix.lowest && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run tests
        run: vendor/bin/pest --testsuite=Feature

  browser:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        filament: ['4.*', '5.*']

    name: Browser · PHP 8.4 · Laravel 13 · Filament ${{ matrix.filament }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl, fileinfo
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --with-all-dependencies

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Publish Filament's assets
        run: vendor/bin/testbench filament:assets

      - name: Run browser tests
        run: vendor/bin/pest --testsuite=Browser
