name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The resource, relation manager or page code that shows the problem.
      render: php
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: filament-version
    attributes:
      label: Filament version
      placeholder: 5.11.0
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel and PHP versions
      placeholder: Laravel 13.0, PHP 8.4
    validations:
      required: true
