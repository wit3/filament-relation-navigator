name: Feature request
description: Something the plugin could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: How you would like it to work, with code if you can.
    validations:
      required: true
