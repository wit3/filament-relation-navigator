<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1280px; height: 720px; overflow: hidden; position: relative;
    font-family: Inter, system-ui, sans-serif;
    background: #18181b; color: #fafafa;
  }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 420px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 64px; line-height: 1.02; font-weight: 700; letter-spacing: -.035em; }
  .new { margin-top: 36px; font: 600 26px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: -.01em; color: #fafafa; }
  .new b { color: #fbbf24; font-weight: 600; }
  .ui {
    position: absolute; left: 500px; top: 96px; width: 820px; height: 720px;
    border-radius: 14px; overflow: hidden; background: #fafafa;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 60px -20px rgba(0,0,0,.6);
  }
  .ui img { display: block; width: 1000px; margin-left: -20px; margin-top: -16px; }
</style>
</head>
<body>
  <div class="copy">
    <h1>Relation<br>Navigator</h1>
    <div class="new">/customers/1<b>/orders</b></div>
  </div>
  <div class="ui"><img src="cover-source.png"></div>
</body>
</html>
